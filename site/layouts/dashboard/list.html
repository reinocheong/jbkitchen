{{ define "main" }}
<div class="page-content" style="max-width:900px;">
  <h1>Dashboard</h1>
  <p style="color:var(--text-3);margin-bottom:0.3rem;">Real-time data · per-page statistics</p>
  <p style="color:var(--text-3);font-size:0.85rem;margin-bottom:2rem;">Data source: CountAPI + Google Analytics</p>

  <!-- Overview -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;">
    <div style="background:var(--card);border-radius:var(--radius);padding:1.2rem;text-align:center;border:1px solid var(--border);">
      <div style="font-size:0.8rem;color:var(--text-3);">Total Views</div>
      <div id="totalViews" class="stat-number">—</div>
    </div>
    <div style="background:var(--card);border-radius:var(--radius);padding:1.2rem;text-align:center;border:1px solid var(--border);">
      <div style="font-size:0.8rem;color:var(--text-3);">Total Pages</div>
      <div id="totalPages" class="stat-number">—</div>
    </div>
    <div style="background:var(--card);border-radius:var(--radius);padding:1.2rem;text-align:center;border:1px solid var(--border);background:var(--green-50);">
      <div style="font-size:0.8rem;color:var(--text-3);">Daily Avg</div>
      <div id="dailyAvg" class="stat-number">—</div>
    </div>
  </div>

  <!-- Page View Rankings -->
  <div style="background:var(--card);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border);margin-bottom:2rem;">
    <h2 style="color:var(--green-800);font-size:1.2rem;margin-bottom:0.3rem;">Page View Rankings</h2>
    <p style="font-size:0.8rem;color:var(--text-3);margin-bottom:1rem;">Real-time page view statistics</p>
    <div id="pageRanking" style="display:flex;flex-direction:column;gap:0.3rem;">
      <div style="text-align:center;padding:2rem;color:var(--text-3);">Loading...</div>
    </div>
  </div>

</div>

<style>
.stat-number { font-size: 1.8rem; font-weight: 900; color: var(--green-700); margin-top: 0.2rem; }
.rank-row { display: flex; align-items: center; padding: 0.6rem 1rem; border-radius: 6px; gap: 0.5rem; }
.rank-row:hover { background: var(--bg); }
.rank-pos { font-weight: 700; color: var(--green-700); min-width: 28px; font-size: 0.9rem; }
.rank-page { flex: 1; font-size: 0.88rem; }
.rank-page a { color: var(--text); text-decoration: none; }
.rank-page a:hover { color: var(--green-600); }
.rank-views { font-weight: 600; color: var(--green-600); min-width: 80px; text-align: right; font-size: 0.85rem; }
.rank-bar { height: 4px; background: var(--green-100); border-radius: 2px; margin: 0 0 0 28px; overflow: hidden; }
.rank-bar-fill { height: 100%; background: var(--green-500); border-radius: 2px; transition: width 0.5s; }
</style>

<script>
// Page list
var PAGES = [
  { key: 'jbkitchen-', label: 'Home', url: '/' },
  { key: 'jbkitchen-chefs', label: 'Chef Directory', url: '/chefs/' },
  { key: 'jbkitchen-chefs-submit', label: 'Submit Resume', url: '/chefs/submit/' },
  { key: 'jbkitchen-chefs-chef-001', label: 'Chen Xiaoming Resume', url: '/chefs/chef-001/' },
  { key: 'jbkitchen-chefs-chef-002', label: 'Lin Xiuying Resume', url: '/chefs/chef-002/' },
  { key: 'jbkitchen-chefs-chef-003', label: 'Ah Ming Resume', url: '/chefs/chef-003/' },
  { key: 'jbkitchen-chefs-chef-004', label: 'Huang Zhiqiang Resume', url: '/chefs/chef-004/' },
  { key: 'jbkitchen-chefs-chef-005', label: 'Zhang Lihua Resume', url: '/chefs/chef-005/' },
  { key: 'jbkitchen-chefs-chef-006', label: 'Li Guohua Resume', url: '/chefs/chef-006/' },
  { key: 'jbkitchen-suppliers', label: 'Supplier Directory', url: '/suppliers/' },
  { key: 'jbkitchen-suppliers-khl-frozen-food', label: 'KHL Details', url: '/suppliers/khl-frozen-food/' },
  { key: 'jbkitchen-calculator', label: 'Cost Calculator', url: '/calculator/' },
  { key: 'jbkitchen-guides', label: 'Guide List', url: '/guides/' },
  { key: 'jbkitchen-guides-halal-cert', label: 'Halal Certification', url: '/guides/halal-cert/' },
  { key: 'jbkitchen-guides-jb-license', label: 'License Checklist', url: '/guides/jb-license/' },
  { key: 'jbkitchen-guides-frozen-food-guide', label: 'Frozen Food Procurement', url: '/guides/frozen-food-guide/' },
  { key: 'jbkitchen-dashboard', label: 'Dashboard', url: '/dashboard/' },
];

async function loadDashboard() {
  var fetches = PAGES.map(function(p) {
    return fetch('https://api.countapi.xyz/get/jbkitchen/' + encodeURIComponent(p.key))
      .then(function(r) { return r.json(); })
      .then(function(d) { return { page: p, views: d.value || 0 }; })
      .catch(function() { return { page: p, views: 0 }; });
  });

  var results = await Promise.all(fetches);
  results.sort(function(a, b) { return b.views - a.views; });

  var total = results.reduce(function(s, r) { return s + r.views; }, 0);
  var maxViews = results[0]?.views || 1;

  document.getElementById('totalViews').textContent = total.toLocaleString();
  document.getElementById('totalPages').textContent = results.length;

  var daysSinceLaunch = Math.max(1, Math.round((new Date() - new Date('2026-06-02')) / (1000*60*60*24)) + 1);
  document.getElementById('dailyAvg').textContent = Math.round(total / daysSinceLaunch).toLocaleString();

  var html = '';
  results.forEach(function(r, i) {
    var pct = Math.round((r.views / maxViews) * 100);
    html += '<div class="rank-row">'
      + '<span class="rank-pos">#' + (i+1) + '</span>'
      + '<span class="rank-page"><a href="' + r.page.url + '">' + r.page.label + '</a></span>'
      + '<span class="rank-views">' + r.views.toLocaleString() + ' views</span>'
      + '</div>'
      + '<div class="rank-bar"><div class="rank-bar-fill" style="width:' + pct + '%;"></div></div>';
  });

  document.getElementById('pageRanking').innerHTML = html;
}

loadDashboard();
</script>
{{ end }}
