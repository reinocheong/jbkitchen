{{ define "main" }}
<div class="page-content" style="max-width:900px;">
  <h1>📊 流量统计面板</h1>
  <p style="color:var(--text-3);margin-bottom:0.3rem;">实时数据 · 每页独立统计 · 数据透明</p>
  <p style="color:var(--text-3);font-size:0.85rem;margin-bottom:2rem;">更新延迟约 1 分钟 · 数据来源：Google Analytics + CountAPI</p>

  <!-- 总计概览卡片 -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:2rem;">
    <div style="background:var(--card);border-radius:var(--radius);padding:1.5rem;text-align:center;border:1px solid var(--border);">
      <div style="font-size:0.8rem;color:var(--text-3);">总访问量</div>
      <div id="totalViews" class="stat-number">—</div>
    </div>
    <div style="background:var(--card);border-radius:var(--radius);padding:1.5rem;text-align:center;border:1px solid var(--border);">
      <div style="font-size:0.8rem;color:var(--text-3);">页面总数</div>
      <div id="totalPages" class="stat-number">—</div>
    </div>
    <div style="background:var(--card);border-radius:var(--radius);padding:1.5rem;text-align:center;border:1px solid var(--border);">
      <div style="font-size:0.8rem;color:var(--text-3);">广告位曝光</div>
      <div class="stat-number" id="adViews">—</div>
    </div>
    <div style="background:var(--card);border-radius:var(--radius);padding:1.5rem;text-align:center;border:1px solid var(--border);background:var(--green-50);">
      <div style="font-size:0.8rem;color:var(--text-3);">本月预估</div>
      <div class="stat-number" id="monthlyEst">—</div>
    </div>
  </div>

  <!-- 各页面排行榜 -->
  <div style="background:var(--card);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border);margin-bottom:2rem;">
    <h2 style="color:var(--green-800);font-size:1.2rem;margin-bottom:1rem;">📈 页面浏览排行</h2>
    <div id="pageRanking" style="display:flex;flex-direction:column;gap:0.5rem;">
      <div style="text-align:center;padding:2rem;color:var(--text-3);">加载中...</div>
    </div>
  </div>

  <!-- 广告主可见 -->
  <div style="background:var(--green-50);border-radius:var(--radius);padding:1.5rem;text-align:center;">
    <h3 style="color:var(--green-800);margin-bottom:0.5rem;">📢 广告主权益</h3>
    <p style="color:var(--text-3);font-size:0.9rem;">
      购买广告位后，你的页面浏览量会出现在上方排行榜中，数据公开透明。<br>
      你也能在 Google Analytics 后台查看更详细的数据。
    </p>
    <a href="/advertise/" class="btn btn-primary" style="margin-top:1rem;">查看广告位与价格</a>
  </div>
</div>

<style>
.stat-number {
  font-size: 2rem;
  font-weight: 900;
  color: var(--green-700);
  margin-top: 0.3rem;
}
.rank-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.7rem 1rem;
  border-radius: 6px;
  transition: background 0.2s;
}
.rank-row:hover { background: var(--bg); }
.rank-pos { font-weight: 700; color: var(--green-700); min-width: 30px; }
.rank-page { flex: 1; font-size: 0.9rem; margin: 0 1rem; }
.rank-page a { color: var(--text); text-decoration: none; }
.rank-page a:hover { color: var(--green-600); }
.rank-views { font-weight: 600; color: var(--green-600); }
.rank-bar {
  height: 6px;
  background: var(--green-100);
  border-radius: 3px;
  margin: 0.3rem 0 0 30px;
  overflow: hidden;
}
.rank-bar-fill {
  height: 100%;
  background: var(--green-500);
  border-radius: 3px;
  transition: width 0.5s;
}
</style>

<script>
// 要追踪的所有页面
var PAGES = [
  { key: 'jbkitchen-', label: '🏠 首页', url: '/' },
  { key: 'jbkitchen-chefs', label: '👨‍🍳 厨师列表', url: '/chefs/' },
  { key: 'jbkitchen-chefs-submit', label: '📝 提交简历', url: '/chefs/submit/' },
  { key: 'jbkitchen-chefs-chef-001', label: '👨‍🍳 陈小明简历', url: '/chefs/chef-001/' },
  { key: 'jbkitchen-chefs-chef-002', label: '👩‍🍳 林秀英简历', url: '/chefs/chef-002/' },
  { key: 'jbkitchen-chefs-chef-003', label: '👨‍🍳 阿明简历', url: '/chefs/chef-003/' },
  { key: 'jbkitchen-chefs-chef-004', label: '👨‍🍳 黄志强简历', url: '/chefs/chef-004/' },
  { key: 'jbkitchen-chefs-chef-005', label: '👩‍🍳 张丽华简历', url: '/chefs/chef-005/' },
  { key: 'jbkitchen-chefs-chef-006', label: '👨‍🍳 李国华简历', url: '/chefs/chef-006/' },
  { key: 'jbkitchen-suppliers', label: '🏪 供应商目录', url: '/suppliers/' },
  { key: 'jbkitchen-suppliers-khl-frozen-food', label: '🥩 KHL 详情', url: '/suppliers/khl-frozen-food/' },
  { key: 'jbkitchen-calculator', label: '🧮 成本计算器', url: '/calculator/' },
  { key: 'jbkitchen-guides', label: '📋 指南列表', url: '/guides/' },
  { key: 'jbkitchen-guides-halal-cert', label: '📋 清真认证', url: '/guides/halal-cert/' },
  { key: 'jbkitchen-guides-jb-license', label: '📋 执照清单', url: '/guides/jb-license/' },
  { key: 'jbkitchen-guides-frozen-food-guide', label: '📋 冷冻采购', url: '/guides/frozen-food-guide/' },
  { key: 'jbkitchen-advertise', label: '📢 广告合作', url: '/advertise/' },
  { key: 'jbkitchen-dashboard', label: '📊 流量面板', url: '/dashboard/' },
];

async function loadDashboard() {
  var results = [];

  // 并行获取所有页面浏览量
  var fetches = PAGES.map(function(p) {
    return fetch('https://api.countapi.xyz/get/jbkitchen/' + encodeURIComponent(p.key))
      .then(function(r) { return r.json(); })
      .then(function(d) { return { page: p, views: d.value || 0 }; })
      .catch(function() { return { page: p, views: 0 }; });
  });

  results = await Promise.all(fetches);
  results.sort(function(a, b) { return b.views - a.views; });

  var total = results.reduce(function(sum, r) { return sum + r.views; }, 0);
  var maxViews = results.length > 0 ? results[0].views : 1;

  // 更新统计数据
  document.getElementById('totalViews').textContent = total.toLocaleString();
  document.getElementById('totalPages').textContent = results.length;

  var adPages = results.filter(function(r) {
    return r.page.key.indexOf('suppliers') >= 0 || r.page.key.indexOf('advertise') >= 0 || r.page.key.indexOf('dashboard') >= 0;
  });
  var adTotal = adPages.reduce(function(s, r) { return s + r.views; }, 0);
  document.getElementById('adViews').textContent = adTotal.toLocaleString();

  // 月度预估（假设日均 × 30）
  var daily = Math.round(total / (new Date() - new Date('2026-06-02')));
  document.getElementById('monthlyEst').textContent = '~' + (daily * 30).toLocaleString();

  // 渲染排行榜
  var html = '';
  results.forEach(function(r, i) {
    var pct = Math.round((r.views / maxViews) * 100);
    html += '<div class="rank-row">'
      + '<span class="rank-pos">#' + (i + 1) + '</span>'
      + '<span class="rank-page"><a href="' + r.page.url + '">' + r.page.label + '</a></span>'
      + '<span class="rank-views">' + r.views.toLocaleString() + ' 次</span>'
      + '</div>'
      + '<div class="rank-bar"><div class="rank-bar-fill" style="width:' + pct + '%;"></div></div>';
  });
  document.getElementById('pageRanking').innerHTML = html;
}

loadDashboard();

// 简单计算日期的函数
Date.prototype.diffDays = function(other) {
  return Math.ceil(Math.abs(this - other) / (1000 * 60 * 60 * 24));
};
</script>
{{ end }}
