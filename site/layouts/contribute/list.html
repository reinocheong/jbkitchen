{{ define "main" }}
<section class="section page-guides">
  <h1>{{ .Title }}</h1>
  <p class="page-subtitle">{{ .Description }}</p>
  <article class="contribute-content">
    {{ .Content }}
  </article>
  <div class="contribute-cta">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdUZbmquM9bHM2e8sLEeU6IF6_nzwvE3j7tqwTm7PnC0HEaJQ/viewform" target="_blank" rel="noopener" class="btn-primary">Submit Your Article →</a>
    <p class="contribute-note">Or email us your draft</p>
  </div>
</section>
{{ end }}
