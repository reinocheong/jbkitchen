{{ define "main" }}
<div class="submit-page">
  <h1>📝 免费挂简历</h1>
  <p class="subtitle">成为 KHL 合作厨师，你的简历会展示给新山各大餐厅老板</p>

  <!-- 流程说明 -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:2rem;">
    <div style="background:var(--card);border-radius:var(--radius);padding:1rem;text-align:center;border:1px solid var(--border);">
      <div style="font-size:1.5rem;">📝</div>
      <strong>填写资料</strong>
      <p style="font-size:0.8rem;color:var(--text-3);">免费提交简历</p>
    </div>
    <div style="background:var(--card);border-radius:var(--radius);padding:1rem;text-align:center;border:1px solid var(--border);">
      <div style="font-size:1.5rem;">📋</div>
      <strong>审核上线</strong>
      <p style="font-size:0.8rem;color:var(--text-3);">24小时内展示在网站</p>
    </div>
    <div style="background:var(--card);border-radius:var(--radius);padding:1rem;text-align:center;border:1px solid var(--border);">
      <div style="font-size:1.5rem;">🤝</div>
      <strong>老板联系你</strong>
      <p style="font-size:0.8rem;color:var(--text-3);">餐厅老板直接找上门</p>
    </div>
  </div>

  <div class="form-card">
    <form id="chefForm">
      <div class="form-group">
        <label>你的名字 *</label>
        <input type="text" id="name" placeholder="如：陈小明" required>
      </div>
      <div class="form-group">
        <label>手机号 *</label>
        <input type="tel" id="phone" placeholder="012-345 6789" required>
        <p class="form-hint">餐厅老板会通过此号码联系你</p>
      </div>
      <div class="form-group">
        <label>厨艺专长 *</label>
        <select id="specialty" required>
          <option value="">请选择</option>
          <option value="中餐">中餐</option>
          <option value="西餐">西餐</option>
          <option value="日料">日料</option>
          <option value="烘焙">烘焙</option>
          <option value="马来餐">马来餐</option>
          <option value="印度餐">印度餐</option>
          <option value="综合">综合/多种菜系</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>经验年限 *</label>
        <select id="exp" required>
          <option value="">请选择</option>
          <option value="1">1年以下</option>
          <option value="2">2-3年</option>
          <option value="5">3-5年</option>
          <option value="8">5-8年</option>
          <option value="10">8年以上</option>
        </select>
      </div>
      <div class="form-group">
        <label>所在地区 *</label>
        <input type="text" id="location" placeholder="如：新山 Johor Bahru" required>
      </div>
      <div class="form-group">
        <label>期望薪资</label>
        <input type="text" id="salary" placeholder="如：RM 3000 - RM 4500">
      </div>
      <div class="form-group">
        <label>最快到岗时间</label>
        <select id="available">
          <option value="随时">随时</option>
          <option value="两周内">两周内</option>
          <option value="一个月内">一个月内</option>
          <option value="面议">面议</option>
        </select>
      </div>
      <div class="form-group">
        <label>自我介绍</label>
        <textarea id="desc" placeholder="简单介绍你的经历、拿手菜、曾任餐厅……"></textarea>
      </div>
      <div class="form-submit">
        <button type="submit" class="btn btn-primary btn-lg">📩 提交简历</button>
        <p class="form-hint" style="margin-top:0.8rem;">提交后资料进入 KHL 厨师库，审核通过后上线展示</p>
      </div>
    </form>

    <div id="submitSuccess" style="display:none;text-align:center;padding:2rem;">
      <div style="font-size:3rem;margin-bottom:1rem;">✅</div>
      <h3 style="color:var(--green-700);margin-bottom:0.5rem;">简历已提交！</h3>
      <p style="color:var(--text-3);">我们会尽快审核并上线展示</p>
      <p style="color:var(--text-3);margin-top:1rem;">餐厅老板很快就会联系你</p>
      <a href="/chefs/" class="btn btn-primary" style="margin-top:1rem;">返回简历列表</a>
    </div>
  </div>
</div>

<script>
// Google Apps Script Web App URL — 替换为实际部署后的网址
// 部署说明：docs/SHEET_SETUP_GUIDE.md
const GAS_URL = '';

document.getElementById('chefForm')?.addEventListener('submit', function(e) {
  e.preventDefault();

  const data = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    specialty: document.getElementById('specialty').value,
    exp: document.getElementById('exp').value,
    location: document.getElementById('location').value,
    salary: document.getElementById('salary').value,
    available: document.getElementById('available').value,
    desc: document.getElementById('desc').value,
  };

  // 1. 推送到 KHL WhatsApp（通知）
  const msg = encodeURIComponent(
    `🍳 新厨师注册\n姓名：${data.name}\n电话：${data.phone}\n专长：${data.specialty}\n经验：${data.exp}年\n地区：${data.location}\n薪资：${data.salary}\n到岗：${data.available}\n介绍：${data.desc}`
  );
  window.open(`{{ .Site.Params.khl_whatsapp }}?text=${msg}`, '_blank');

  // 2. 写入 Google Sheet（XLSX 记录）
  if (GAS_URL) {
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).catch(function() {});
  }

  // 显示成功
  document.getElementById('chefForm').style.display = 'none';
  document.getElementById('submitSuccess').style.display = 'block';
});
</script>
{{ end }}
