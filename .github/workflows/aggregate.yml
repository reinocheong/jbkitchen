name: 每日数据聚合

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install feedparser requests

      - name: Run Aggregator
        run: python scripts/aggregate.py

      - name: Build Hugo Site
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true

      - name: Hugo Build
        run: hugo --minify --source site

      - name: Commit & Push Data
        run: |
          git config user.name "jbkitchen Bot"
          git config user.email "bot@jbkitchen.com"
          git add data/ site/data/ site/public/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🔄 [auto] 数据更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
